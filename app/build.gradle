apply plugin: 'com.android.application'

android {
    namespace 'com.example.alarmapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.alarmapp"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Uses standard Android built-ins; no external libraries needed
}
